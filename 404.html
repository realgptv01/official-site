<style>
body {
  background-color: darkred;
  font-family: verdana;
  margin: 0;
  display: flex;
  height: 100vh;
  color: white;
  overflow: hidden;
}

/* Sidebar Styling matching your typography scheme */
.sidebar {
  width: 320px;
  background: rgba(0, 0, 0, 0.4);
  padding: 25px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 20px;
  border-right: 2px solid rgba(255, 255, 255, 0.1);
  overflow-y: auto;
  height: 100%;
}

.control-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

label {
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #ffcccc;
  font-weight: bold;
}

input[type="text"], select {
  padding: 10px;
  background: rgb(80, 0, 0);
  border: 1px solid rgba(255, 255, 255, 0.3);
  color: #fff;
  border-radius: 4px;
  font-size: 14px;
  font-family: verdana;
}

select option {
  background: rgb(80, 0, 0);
  color: #fff;
}

/* Drag and Drop Box Styling */
.drop-zone {
  border: 2px dashed rgba(255, 94, 94, 0.5);
  border-radius: 6px;
  padding: 15px;
  text-align: center;
  background: rgba(80, 0, 0, 0.3);
  cursor: pointer;
  transition: all 0.2s ease;
}
.drop-zone.dragover {
  background: rgba(255, 94, 94, 0.2);
  border-color: #ff5e5e;
}
.drop-zone p {
  margin: 0;
  font-size: 12px;
  color: #ffcccc;
  pointer-events: none;
}

.color-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.color-item {
  display: flex;
  flex-direction: column;
  gap: 5px;
  text-align: center;
}

input[type="color"] {
  width: 100%;
  height: 40px;
  border: 1px solid rgba(255, 255, 255, 0.3);
  background: none;
  cursor: pointer;
  border-radius: 4px;
  padding: 0;
}

input[type="range"] {
  width: 100%;
  accent-color: #ff5e5e;
}

.btn-png {
  padding: 12px;
  border: none;
  border-radius: 4px;
  font-weight: bold;
  cursor: pointer;
  text-transform: uppercase;
  font-size: 13px;
  background-color: #ff5e5e;
  color: white;
  font-family: verdana;
  transition: opacity 0.2s;
}

.btn-png:hover {
  opacity: 0.9;
}

/* Main content presentation area */
.main-content {
  flex: 1;
  padding: 40px;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  overflow-y: auto;
  transition: background-color 0.1s ease;
}

h1 {
  color: white;
  text-align: left;
  font-family: verdana;
  margin-top: 20px;
}

h2 {
  color: white;
  text-align: left;
  font-family: verdana;
  font-size: 35px;
}

p, a {
  font-family: verdana;
  font-size: 20px;
  color: white;
  text-align: left;
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

.css-3d-text {
  font-size: 95px;
  color: #ff5e5e;
  font-family: Verdana, Geneva, sans-serif;
  font-weight: bold;
  text-align: left;
  line-height: 1.2;
  margin-bottom: 20px;
  word-break: break-word;
}
</style>
